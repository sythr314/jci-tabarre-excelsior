<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 358" role="img" aria-label="JCI Tabarre Excelsior">

  <!-- JCI Wordmark (white — for dark backgrounds) -->
  <text
    x="32" y="207"
    font-family="Montserrat, 'Arial Black', Helvetica, sans-serif"
    font-weight="900"
    font-size="172"
    fill="#ffffff"
    letter-spacing="-5">JCI</text>

  <!-- Shield Emblem -->
  <svg x="290" y="44" width="122" height="156" viewBox="0 0 122 156">
    <defs>
      <clipPath id="shield-left-w">
        <rect x="0" y="0" width="61" height="156"/>
      </clipPath>
      <clipPath id="shield-right-w">
        <rect x="61" y="0" width="61" height="156"/>
      </clipPath>
    </defs>

    <!-- Outer shield — blue left half -->
    <path
      d="M 22,0 H 100 Q 122,0 122,22 V 88 Q 118,128 61,154 Q 4,128 0,88 V 22 Q 0,0 22,0 Z"
      fill="#29ABE2"
      clip-path="url(#shield-left-w)"/>

    <!-- Outer shield — teal right half -->
    <path
      d="M 22,0 H 100 Q 122,0 122,22 V 88 Q 118,128 61,154 Q 4,128 0,88 V 22 Q 0,0 22,0 Z"
      fill="#5BC8C0"
      clip-path="url(#shield-right-w)"/>

    <!-- Inner navy shield -->
    <path
      d="M 35,15 H 87 Q 107,15 107,35 V 86 Q 103,117 61,138 Q 19,117 15,86 V 35 Q 15,15 35,15 Z"
      fill="#1B2A6B"/>

    <!-- White concentric outline 1 -->
    <path
      d="M 39,20 H 83 Q 102,20 102,39 V 84 Q 98,113 61,133 Q 24,113 20,84 V 39 Q 20,20 39,20 Z"
      fill="none" stroke="#ffffff" stroke-width="2.5"/>

    <!-- White concentric outline 2 -->
    <path
      d="M 48,30 H 74 Q 91,30 91,47 V 80 Q 87,104 61,120 Q 35,104 31,80 V 47 Q 31,30 48,30 Z"
      fill="none" stroke="#ffffff" stroke-width="2.5"/>

    <!-- Central V arrow -->
    <path
      d="M 20,65 L 61,132 L 102,65"
      fill="none" stroke="#ffffff" stroke-width="2.5"
      stroke-linecap="round" stroke-linejoin="round"/>
  </svg>

  <!-- TM trademark -->
  <text
    x="418" y="96"
    font-family="Arial, Helvetica, sans-serif"
    font-size="15"
    fill="#aaaaaa">™</text>

  <!-- Tabarre -->
  <text
    x="32" y="274"
    font-family="Montserrat, Arial, Helvetica, sans-serif"
    font-weight="700"
    font-size="43"
    fill="#29ABE2">Tabarre</text>

  <!-- Excelsior -->
  <text
    x="32" y="328"
    font-family="Montserrat, Arial, Helvetica, sans-serif"
    font-weight="700"
    font-size="43"
    fill="#29ABE2">Excelsior</text>

</svg>
